<script>
const data = [["Who is the narrator of the story “The Priceless Gift”?", ["Mr. Gupta", "Franky", "Maggie", "Mrs. Bethy"], 0, "The story is narrated by Mr. Gupta, an Indian who meets Maggie in a vegetarian restaurant."], ["Where did the narrator first see Maggie?", ["At a bus stand", "In a vegetarian restaurant", "At a railway station", "In a market"], 1, "He first noticed Maggie in a crowded vegetarian restaurant at lunchtime."], ["When did Maggie usually visit the restaurant?", ["Every day", "On Sundays", "On Saturdays, on pay day", "On Mondays"], 2, "The waiter said that she came on Saturdays, on pay day only."], ["What first attracted the narrator’s attention towards Maggie?", ["Her beautiful dress", "Her large, sad eyes", "Her loud voice", "Her expensive ring"], 1, "The narrator noticed her large eyes with a sad expression."], ["What did Maggie ask the cashier about the narrator?", ["Is he a soldier?", "Is he a doctor?", "Is that gentleman an Indian?", "Is he a teacher?"], 2, "She wanted to know whether the gentleman was an Indian because her brother was in India."], ["What did the waiter tell the narrator about Maggie?", ["She was very rich", "She came only on Saturdays and perhaps earned little", "She owned the restaurant", "She was a student"], 1, "The waiter observed that she came on Saturdays only and guessed that she did not earn much."], ["Why was Maggie worried?", ["Her mother had lost her ring", "Her brother had not written for a long time", "She had lost her job", "The narrator was leaving"], 1, "Her brother Franky was in India, and the family had not received a letter from him for a long time."], ["What was the name of Maggie’s brother?", ["Franky", "Gupta", "Peter", "John"], 0, "Maggie’s brother was named Franky."], ["What was Franky’s occupation?", ["A doctor", "A shopkeeper", "A soldier", "A teacher"], 2, "Franky was a soldier serving in India."], ["With whom did Maggie live?", ["Her father", "Her brother", "Her old widowed mother", "Her aunt"], 2, "Maggie lived with her old, widowed mother, Mrs. Bethy."], ["What was Mrs. Bethy doing when Mr. Gupta met her?", ["Washing clothes", "Making cakes", "Reading a letter", "Gardening"], 1, "She was making cakes to sell that evening."], ["Why could Mrs. Bethy not shake hands with Mr. Gupta?", ["She was ill", "Her hands were covered with flour", "She was angry", "She was holding a baby"], 1, "She apologised because her hands were covered with flour while she was making cakes."], ["How did Maggie’s family earn their living?", ["By selling flowers", "By selling cakes", "By farming", "By running a shop"], 1, "Mrs. Bethy made cakes for people to buy in the evening."], ["Which Indian region was Franky posted in?", ["Bengal", "Punjab", "Odisha", "Gujarat"], 1, "Mrs. Bethy said that her son was in the Punjab."], ["What did Mrs. Bethy fear about India?", ["There were too many storms", "Snakes and tigers might kill people", "There was no food", "It was always cold"], 1, "She asked whether India was safe and whether snakes and tigers killed people."], ["What did Mrs. Bethy show Mr. Gupta?", ["A map", "A photograph of Franky", "A newspaper", "A letter from Maggie"], 1, "She carefully kept and showed him Franky’s photograph in an envelope."], ["What had Franky sent to Maggie?", ["A watch", "A book", "A ring", "A necklace"], 2, "Franky had sent Maggie a ring."], ["What did Mrs. Bethy believe about the ring?", ["It could cure illness", "It could show a distant person when someone gazed into it", "It could bring good luck in business", "It could make wishes come true"], 1, "She believed that concentrating on a distant person while looking into the ring would reveal that person."], ["Why did Mr. Gupta not tell them the truth about the ring at first?", ["He had lost the ring", "He did not want to shatter their dream", "He believed it was magical", "He was afraid of Maggie"], 1, "He realised that the ring was not miraculous and did not want to destroy their hope."], ["What happened to Mrs. Bethy after Mr. Gupta assured her that Franky was alive and well?", ["She became more anxious", "She soon recovered", "She left the house", "She became angry"], 1, "The assurance brought her happiness, and she soon recovered."], ["Why did Maggie ask Mr. Gupta to tell her mother that Franky was alive?", ["She wanted to test him", "Her mother was seriously ill and anxious", "She wanted money", "She wanted him to stay longer"], 1, "Maggie feared that her mother’s anxiety about Franky was worsening her serious illness."], ["What had actually happened to Franky?", ["He had returned home", "He had been promoted", "He had been killed in frontier fighting", "He had gone missing at sea"], 2, "The narrator later learned that Franky had been killed in the fighting on the frontier."], ["How did Mr. Gupta inform Maggie and her mother about his departure?", ["By telephone", "Through a letter", "Through the waiter", "By telegram"], 1, "He wrote a letter announcing his departure and bidding them goodbye."], ["Why was Maggie wearing black when she visited Mr. Gupta?", ["It was a festival", "She was in mourning for Franky", "She was going to a party", "It was her uniform"], 1, "Franky had died, and Maggie was wearing black as a sign of mourning."], ["What did Mr. Gupta promise Maggie?", ["To bring Franky home", "To visit Franky’s grave and write to her", "To send her a ring", "To find her a job"], 1, "He promised to visit Franky’s grave when he reached that part of India and write to Maggie."], ["What did Maggie give Mr. Gupta before he left?", ["A flower", "A shilling", "A photograph", "A letter"], 1, "Maggie gave him a shilling to buy flowers for her brother’s grave."], ["What did Maggie want Mr. Gupta to do with the shilling?", ["Buy food for her mother", "Buy flowers and lay them on Franky’s grave", "Post a letter", "Buy a new ring"], 1, "She asked him to buy flowers and place them on her brother’s grave."], ["Why did Mr. Gupta feel emotional when Maggie gave him the shilling?", ["It was a rare coin", "Maggie had earned it through hard work and was sacrificing it out of love", "He wanted to keep the money", "He had never seen a shilling"], 1, "He knew how hard Maggie worked and understood the depth of her sacrifice."], ["Why did Mr. Gupta accept the shilling instead of returning it?", ["He needed the money", "He did not want to deprive Maggie of the joy of her sacrifice", "He wanted to buy food", "Maggie forced him"], 1, "He realised that accepting it would allow Maggie the happiness of doing something for her brother."], ["Why is Maggie’s gift called “The Priceless Gift”?", ["It was made of gold", "Its emotional value and love were beyond money", "It was very expensive", "It was an ancient object"], 1, "The shilling was materially small but priceless because it represented Maggie’s deep love and sacrifice."], ["What is the central theme of the story?", ["Wealth and power", "Love, sacrifice, hope and human kindness", "War strategy", "Travel and adventure"], 1, "The story highlights family love, sacrifice, compassion and the value of emotional gifts."], ["The word “aroused” means:", ["Put to sleep", "Awakened or stirred", "Forgotten", "Hidden"], 1, "“Aroused” means awakened or stirred, as in the narrator’s curiosity."], ["The word “persisted” means:", ["Continued to exist", "Disappeared quickly", "Became weaker", "Was forgotten"], 0, "“Persisted” means continued to exist or continued."], ["The word “poverty-stricken” means:", ["Extremely rich", "Suffering from lack of money", "Very healthy", "Well educated"], 1, "The glossary explains it as suffering extremely because of lack of money."], ["The word “aggravated” means:", ["Improved", "Worsened", "Solved", "Ignored"], 1, "Mrs. Bethy’s condition was aggravated, meaning it became worse."], ["The phrase “in a fix” means:", ["In a celebration", "In a dilemma or difficult situation", "On a journey", "At work"], 1, "The narrator was in a fix because he did not know how to console Mrs. Bethy."], const letters=['A','B','C','D'];
const root=document.getElementById('questions');
data.forEach((q,i)=>{
 let card=document.createElement('section');card.className='qcard';card.id='q'+i;
 let title=document.createElement('div');title.className='qtitle';title.innerHTML='<span class="num">Q'+(i+1)+'.</span> '+q[0];card.appendChild(title);
 q[1].forEach((op,j)=>{
  let label=document.createElement('label');label.className='option';
  label.innerHTML='<input type="radio" name="q'+i+'" value="'+j+'" onchange="updateProgress()"> <b>'+letters[j]+'.</b> '+op;
  card.appendChild(label);
 });
 let fb=document.createElement('div');fb.className='feedback';fb.id='fb'+i;card.appendChild(fb);root.appendChild(card);
});
function updateProgress(){let n=data.filter((q,i)=>document.querySelector('input[name=q'+i+']:checked')).length;document.getElementById('progress').textContent=n+' / '+data.length+' answered';}
function grade(reveal=true){
 let score=0;
 data.forEach((q,i)=>{
  let chosen=document.querySelector('input[name=q'+i+']:checked');
  if(chosen && Number(chosen.value)===q[2])score++;
  let card=document.getElementById('q'+i);
  [...card.querySelectorAll('.option')].forEach((el,j)=>{
   el.classList.remove('correct','wrong');
   if(j===q[2])el.classList.add('correct');
   if(chosen && Number(chosen.value)===j && j!==q[2])el.classList.add('wrong');
  });
  if(reveal){let fb=document.getElementById('fb'+i);fb.style.display='block';fb.innerHTML='<b>Correct answer: '+letters[q[2]]+'. '+q[1][q[2]]+'</b><br>'+q[3];}
 });
 return score;
}
function submitQuiz(){let score=grade(true);let attempted=data.filter((q,i)=>document.querySelector('input[name=q'+i+']:checked')).length;let r=document.getElementById('result');r.style.display='block';r.innerHTML='Your Score: '+score+' / '+data.length+'<br><small>Attempted: '+attempted+' | Correct: '+score+' | Incorrect/Unanswered: '+(data.length-score)+'</small>';r.scrollIntoView({behavior:'smooth'});}
function showAnswers(){grade(true);document.getElementById('result').style.display='none';}
</script></body></html>
