<!DOCTYPE html>
<html lang="or">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GyanSetu Odisha</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --secondary: #0284c7;
      --accent: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --success: #16a34a;
      --danger: #dc2626;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; padding: 1.25rem 1rem; text-align: center; position: sticky; top: 0; z-index: 10; box-shadow: var(--shadow); }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header p { font-size: 0.85rem; opacity: 0.9; margin-top: 4px; }
    main { flex: 1; padding: 1rem; max-width: 600px; margin: 0 auto; width: 100%; }
    .view { display: none; animation: fadeIn 0.2s ease-in-out; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 1rem; font-size: 0.85rem; color: var(--text-muted); }
    .breadcrumb button { background: none; border: none; color: var(--secondary); cursor: pointer; font-weight: 600; padding: 0; }
    .grid-menu { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .card { background: var(--card-bg); border-radius: var(--radius); padding: 1.25rem 1rem; text-align: center; box-shadow: var(--shadow); cursor: pointer; border: 1px solid #e2e8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px; }
    .card:active { transform: scale(0.98); }
    .card-icon { font-size: 1.75rem; margin-bottom: 8px; }
    .card-title { font-size: 1rem; font-weight: 600; color: var(--text); }
    .subject-card { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border-radius: var(--radius); padding: 1rem; margin-bottom: 10px; box-shadow: var(--shadow); border: 1px solid #e2e8f0; }
    .subject-info h3 { font-size: 0.95rem; color: var(--text); }
    .subject-actions { display: flex; gap: 8px; }
    .btn { padding: 0.5rem 0.85rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; }
    .btn-quiz { background-color: #fef3c7; color: #b45309; }
    .topic-list { display: flex; flex-direction: column; gap: 10px; }
    .topic-item { background: var(--card-bg); padding: 1rem; border-radius: var(--radius); border: 1px solid #e2e8f0; box-shadow: var(--shadow); cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-decoration: none; color: inherit; }
    .topic-item:hover { border-color: var(--secondary); }
    .no-data { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <header>
    <h1>ଜ୍ଞାନସେତୁ ଓଡ଼ିଶା (GyanSetu)</h1>
    <p>NCERT & Odisha State Board Learning Portal</p>
  </header>

  <main>
    <!-- View 1: Classes -->
    <section id="view-classes" class="view active">
      <div class="breadcrumb">ଶ୍ରେଣୀ ଚୟନ କରନ୍ତୁ (Select Class)</div>
      <div class="grid-menu" id="class-grid"></div>
    </section>

    <!-- View 2: Subjects -->
    <section id="view-subjects" class="view">
      <div class="breadcrumb">
        <button onclick="navigate('view-classes')">ଶ୍ରେଣୀ</button> &gt; <span id="bc-class"></span>
      </div>
      <div id="subject-list"></div>
    </section>

    <!-- View 3: Chapters/Topics -->
    <section id="view-topics" class="view">
      <div class="breadcrumb">
        <button onclick="navigate('view-classes')">ଶ୍ରେଣୀ</button> &gt;
        <button onclick="navigate('view-subjects')" id="bc-subject-prev"></button> &gt;
        <span id="bc-topic">ଅଧ୍ୟାୟ</span>
      </div>
      <div id="topic-list" class="topic-list"></div>
    </section>
  </main>

  <script>
    let dbData = null;
    let selectedClass = "";
    let selectedSubject = "";

    // Subject mapping to handle internal keys matching JSON structure
    const SUBJECT_KEYS = {
      "FLO - ODIA (ସାହିତ୍ୟ ସିନ୍ଧୁ)": "ODIA",
      "MIL ODIA (ମାତୃଭାଷା)": "ODIA",
      "SLE - ENGLISH (ଇଂରାଜୀ)": "ENGLISH",
      "ENGLISH (ଇଂରାଜୀ)": "ENGLISH",
      "SCIENCE (비ଜ୍ଞାନ)": "SCIENCE",
      "PHYSICAL SCIENCE (ଭୌତିକ ବିଜ୍ଞାନ)": "SCIENCE",
      "LIFE SCIENCE (ଜୀବ ବିଜ୍ଞାନ)": "SCIENCE",
      "MATHEMATICS (ଗଣିତ)": "MATHEMATICS",
      "HISTORY & POL. SC. (ଇତିହାସ ଓ ରାଜନୀତି)": "HISTORY",
      "HISTORY & CIVICS (ଇତିହାସ ଓ ରାଜନୀତି)": "HISTORY",
      "GEOGRAPHY & ECON. (ଭୂଗୋଳ ଓ ଅର୍ଥନୀତି)": "GEOGRAPHY",
      "GEOGRAPHY (ଭୂଗୋଳ)": "GEOGRAPHY",
      "SOCIAL SCIENCE": "SOCIAL SCIENCE",
      "TLH - HINDI (ହିନ୍ଦୀ)": "HINDI",
      "HINDI (ହିନ୍ଦୀ)": "HINDI",
      "TLS - SANSKRIT (ସଂସ୍କୃତ)": "SANSKRIT",
      "SANSKRIT (ସଂସ୍କୃତ)": "SANSKRIT"
    };

    const SUBJECT_MAP = {
      "CLASS VI": ["MIL ODIA (ମାତୃଭାଷା)", "ENGLISH (ଇଂରାଜୀ)", "MATHEMATICS (ଗଣିତ)", "SCIENCE (ବିଜ୍ଞାନ)", "HISTORY & CIVICS (ଇତିହାସ ଓ ରାଜନୀତି)", "GEOGRAPHY (ଭୂଗୋଳ)", "HINDI (ହିନ୍ଦୀ)", "SANSKRIT (ସଂସ୍କୃତ)"],
      "CLASS VII": ["MIL ODIA (ମାତୃଭାଷା)", "ENGLISH (ଇଂରାଜୀ)", "MATHEMATICS (ଗଣିତ)", "SCIENCE (ବିଜ୍ଞାନ)", "HISTORY & CIVICS (ଇତିହାସ ଓ ରାଜନୀତି)", "GEOGRAPHY (ଭୂଗୋଳ)", "HINDI (ହିନ୍ଦୀ)", "SANSKRIT (ସଂସ୍କୃତ)"],
      "CLASS VIII": ["MIL ODIA (ମାତୃଭାଷା)", "ENGLISH (ଇଂରାଜୀ)", "MATHEMATICS (ଗଣିତ)", "SCIENCE (ବିଜ୍ଞାନ)", "HISTORY & CIVICS (ଇତିହାସ ଓ ରାଜନୀତି)", "GEOGRAPHY (ଭୂଗୋଳ)", "HINDI (ହିନ୍ଦୀ)", "SANSKRIT (ସଂସ୍କୃତ)"],
      "CLASS IX": ["FLO - ODIA (ମାତୃଭାଷା ସାହିତ୍ୟ)", "SLE - ENGLISH (ଇଂରାଜୀ)", "MATHEMATICS (ଗଣିତ)", "PHYSICAL SCIENCE (ଭୌତିକ ବିଜ୍ଞାନ)", "LIFE SCIENCE (ଜୀବ ବିଜ୍ଞାନ)", "HISTORY & POL. SC. (ଇତିହାସ ଓ ରାଜନୀତି)", "GEOGRAPHY & ECON. (ଭୂଗୋଳ ଓ ଅର୍ଥନୀତି)", "TLH - HINDI (ହିନ୍ଦୀ)", "TLS - SANSKRIT (ସଂସ୍କୃତ)"],
      "CLASS X": ["FLO - ODIA (ସାହିତ୍ୟ ସିନ୍ଧୁ)", "SLE - ENGLISH (ଇଂରାଜୀ)", "MATHEMATICS (ଗଣିତ)", "PHYSICAL SCIENCE (ଭୌତିକ ବିଜ୍ଞାନ)", "LIFE SCIENCE (ଜୀବ ବିଜ୍ଞାନ)", "HISTORY & POL. SC. (ଇତିହାସ ଓ ରାଜନୀତି)", "GEOGRAPHY & ECON. (ଭୂଗୋଳ ଓ ଅର୍ଥନୀତି)", "TLH - HINDI (ହିନ୍ଦୀ)", "TLS - SANSKRIT (ସଂସ୍କୃତ)"]
    };

    // Fetch configuration dynamically from JSON
    async function fetchQuizMetadata() {
      try {
        const response = await fetch('mcq_data.json');
        dbData = await response.json();
        renderClasses();
      } catch (error) {
        console.error("Error loading configuration mapping:", error);
        document.getElementById('class-grid').innerHTML = "<div class='no-data'>ଡାଟା ଲୋଡ୍ କରିବାରେ ବିଫଳ ହେଲା। ଦୟାକରି ଫାଇଲ୍ ଯାଞ୍ଚ କରନ୍ତୁ।</div>";
      }
    }

    function navigate(viewId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    function renderClasses() {
      const grid = document.getElementById('class-grid');
      grid.innerHTML = "";
      Object.keys(SUBJECT_MAP).forEach(className => {
        const card = document.createElement('div');
        card.className = "card";
        card.innerHTML = `
          <div class="card-icon">🎓</div>
          <div class="card-title">${className}</div>
        `;
        card.onclick = () => selectClass(className);
        grid.appendChild(card);
      });
    }

    function selectClass(className) {
      selectedClass = className;
      document.getElementById('bc-class').innerText = className;
      
      const listContainer = document.getElementById('subject-list');
      listContainer.innerHTML = "";
      
      const subjects = SUBJECT_MAP[className] || [];
      subjects.forEach(subName => {
        const card = document.createElement('div');
        card.className = "subject-card";
        card.innerHTML = `
          <div class="subject-info">
            <h3>${subName}</h3>
          </div>
          <div class="subject-actions">
            <button class="btn btn-quiz">ଅଧ୍ୟାୟ ଦେଖନ୍ତୁ</button>
          </div>
        `;
        card.onclick = () => selectSubject(subName);
        listContainer.appendChild(card);
      });
      
      navigate('view-subjects');
    }

    function selectSubject(subName) {
      selectedSubject = subName;
      document.getElementById('bc-subject-prev').innerText = subName;
      
      const topicList = document.getElementById('topic-list');
      topicList.innerHTML = "";
      
      const internalKey = SUBJECT_KEYS[subName] || subName;
      
      // Extract data safely from parsed JSON object hierarchy
      let chapters = [];
      if (dbData && dbData[selectedClass] && dbData[selectedClass][internalKey]) {
        chapters = dbData[selectedClass][internalKey];
      }
      
      if (chapters.length === 0) {
        topicList.innerHTML = "<div class='no-data'>ଏହି ବିଷୟ ପାଇଁ କୌଣସି ଅଧ୍ୟାୟ ମିଳିଲା ନାହିଁ।</div>";
      } else {
        chapters.forEach(ch => {
          const item = document.createElement('a');
          item.className = "topic-item";
          item.href = ch.file; // Redirects directly to the specific chapter html file
          item.innerHTML = `
            <span>📖 ${ch.title}</span>
            <span style="color: var(--secondary); font-weight:600;">Start &rarr;</span>
          `;
          topicList.appendChild(item);
        });
      }
      
      navigate('view-topics');
    }

    window.onload = fetchQuizMetadata;
  </script>
</body>
</html>
