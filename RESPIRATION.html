<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ଦଶମ ଶ୍ରେଣୀ ଜୀବବିଜ୍ଞାନ - ଶ୍ଵସନ (Respiration) MCQ ଅଭ୍ୟାସ</title>
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }
        body {
            font-family: 'Kalinga', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .quiz-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 2px solid #eee;
            padding-bottom: 15px;
        }
        .header h1 {
            color: #2c3e50;
            margin: 0 0 10px 0;
            font-size: 1.8em;
        }
        .header p {
            color: #7f8c8d;
            margin: 0;
            font-size: 1.1em;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 8px;
            margin-bottom: 20px;
            overflow: hidden;
            height: 10px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background-color: var(--primary-color);
            transition: width 0.3s ease;
        }
        .quiz-info {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
        }
        .question-box {
            font-size: 1.2em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 25px 0;
        }
        .option-item {
            padding: 12px 18px;
            margin-bottom: 10px;
            background: #fafafa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05em;
        }
        .option-item:hover:not(.disabled) {
            background: #ebf5fb;
            border-color: var(--primary-color);
        }
        .option-item.selected {
            background: #ebf5fb;
            border-color: var(--primary-color);
        }
        .option-item.correct {
            background: #d4efdf !important;
            border-color: var(--success-color) !important;
            color: #145a32;
            font-weight: bold;
        }
        .option-item.incorrect {
            background: #fadbd8 !important;
            border-color: var(--error-color) !important;
            color: #78281f;
        }
        .option-item.disabled {
            cursor: default;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1em;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        .btn:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        .result-container {
            text-align: center;
            display: none;
        }
        .result-container h2 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 15px;
        }
        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: var(--primary-color);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5em;
            font-weight: bold;
            margin: 0 auto 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .result-msg {
            font-size: 1.2em;
            color: #555;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h1>ଦଶମ ଶ୍ରେଣୀ ଜୀବବିଜ୍ଞାନ</h1>
        <p>ଅଧ୍ୟାୟ ୨: ଶ୍ଵସନ (Respiration) - MCQ ଅଭ୍ୟାସ କେନ୍ଦ୍ର</p>
    </div>

    <div id="quiz-screen">

        <ul class="options-list" id="options-list">
            <!-- Options will be populated via JavaScript -->
        </ul>

        <div class="btn-container">
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>ପରବର୍ତ୍ତୀ ପ୍ରଶ୍ନ</button>
        </div>
    </div>

    <div class="result-container" id="result-screen">
        <h2>ଅଭ୍ୟାସ ସମାପ୍ତ ହେଲା!</h2>
        <div class="score-circle" id="final-score">୦/୧୦୦</div>

    </div>
</div>

<script>

    { q: "ଶ୍ଵସନ ପ୍ରକ୍ରିୟାରେ ଖାଦ୍ୟ ଜାରଣ ଦ୍ୱାରା ବ୍ୟବହାରକ୍ଷମ ଶକ୍ତି କେଉଁ ରୂପରେ ସଞ୍ଚିତ ହୁଏ?", options: ["DNA", "RNA", "ATP", "NADP"], correct: 2 },
    { q: "ଅମ୍ଳଜାନ ଉପସ୍ଥିତିରେ ହେଉଥିବା ଶ୍ଵସନକୁ କ'ଣ କୁହାଯାଏ?", options: ["ବାୟୁ ଅପଜୀବୀ ଶ୍ଵସନ", "ବାୟୁ ଉପଜୀବୀ ଶ୍ଵସନ (Aerobic respiration)", "କିଣ୍ବନ", "ଗ୍ଲାଇକୋଲିସିସ୍"], correct: 1 },

    { q: "ଗ୍ଲାଇକୋଲିସିସ୍ ର ଶେଷରେ ୩-କାର୍ବନଯୁକ୍ତ ଶର୍କରା କେଉଁ ଅମ୍ଳରେ ପରିଣତ ହୁଏ?", options: ["ଲାକଟିକ୍ ଅମ୍ଳ", "ଇଥାନଲ୍", "ପାଇରୁଭିକ୍ ଅମ୍ଳ (Pyruvic acid)", "ସାଇଟ୍ରିକ୍ ଅମ୍ଳ"], correct: 2 },

    { q: "ମନୁଷ୍ୟ ଶ୍ଵସନଳୀରେ ଥିବା ଉପାସ୍ଥି ବଳୟଗୁଡ଼ିକର କାମ କ'ଣ?", options: ["ଶ୍ଵସନଳୀକୁ ବନ୍ଦ ନ କରିବା / ସବୁବେଳେ ଖୋଲା ରଖିବା", "ଖାଦ୍ୟ ଅଟକାଇବା", "ଶକ୍ତି ଦେବା", "ଧ୍ୱନି ସୃଷ୍ଟି କରିବା"], correct: 0 },
    { q: "ଇଷ୍ଟ ଏବଂ ବ୍ୟାକ୍ଟେରିଆରେ କେଉଁ ପ୍ରକାର କିଣ୍ବନ ହୋଇଥାଏ?", options: ["ସୁରାସାର କିଣ୍ବନ", "ଲାକ୍ଟିକ୍ ଅମ୍ଳ କିଣ୍ବନ", "ସାଇଟ୍ରିକ୍ ଅମ୍ଳ କିଣ୍ବନ", "କୌଣସିଟି ନୁହେଁ"], correct: 0 },
    { q: "ବକ୍ଷଗହ୍ୱରର ପାର୍ଶ୍ୱଦେଶ କାହା ଦ୍ୱାରା ଆବଦ୍ଧ?", options: ["ପଞ୍ଜରା ହାଡ଼ ଓ ଅନ୍ତଃ-ପଞ୍ଜରା ମାଂସପେଶୀ", "ଷ୍ଟର୍‌ନମ୍", "ମେରୁଦଣ୍ଡ", "ମଧ୍ୟଚ୍ଛଦା"], correct: 0 }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionNumber = document.getElementById("question-number");
const scoreDisplay = document.getElementById("score-display");
const progressBar = document.getElementById("progress-bar");
const questionText = document.getElementById("question-text");
const optionsList = document.getElementById("options-list");
const nextBtn = document.getElementById("next-btn");
const quizScreen = document.getElementById("quiz-screen");
const resultScreen = document.getElementById("result-screen");
const finalScore = document.getElementById("final-score");
const resultMsg = document.getElementById("result-msg");

function loadQuestion() {
    answered = false;
    nextBtn.disabled = true;
    
    const q = quizData[currentQuestion];
    questionNumber.innerText = `ପ୍ରଶ୍ନ ${currentQuestion + 1} / ${quizData.length}`;
    scoreDisplay.innerText = `ସ୍କୋର: ${score}`;
    progressBar.style.width = `${((currentQuestion) / quizData.length) * 100}%`;
    
    questionText.innerText = `${currentQuestion + 1}. ${q.q}`;
    optionsList.innerHTML = "";
    
    q.options.forEach((option, index) => {
        const li = document.createElement("li");
        li.className = "option-item";
        li.innerText = `(${String.fromCharCode(97 + index).toUpperCase()}) ${option}`;
        li.onclick = () => selectOption(index, li);
        optionsList.appendChild(li);
    });
}

function selectOption(selectedIndex, element) {
    if (answered) return;
    answered = true;
    
    const q = quizData[currentQuestion];
    const optionItems = optionsList.getElementsByClassName("option-item");
    
    if (selectedIndex === q.correct) {
        element.classList.add("correct");
        score++;
        scoreDisplay.innerText = `ସ୍କୋର: ${score}`;
    } else {
        element.classList.add("incorrect");
        optionItems[q.correct].classList.add("correct");
    }
    
    for (let item of optionItems) {
        item.classList.add("disabled");
    }
    
    nextBtn.disabled = false;
}

function nextQuestion() {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    quizScreen.style.display = "none";
    resultScreen.style.display = "block";
    finalScore.innerText = `${score}/${quizData.length}`;
    
    let percentage = (score / quizData.length) * 100;
    if (percentage >= 90) {
        resultMsg.innerText = "ଅତି ଉତ୍ତମ! ଆପଣଙ୍କ ପ୍ରସ୍ତୁତି ସମ୍ପୂର୍ଣ୍ଣ ପ୍ରକୃଷ୍ଟ ଅଛି।";
    } else if (percentage >= 70) {
        resultMsg.innerText = "ଉତ୍ତମ ପ୍ରଦର୍ଶନ! ଆଉାକିଛି ଅଭ୍ୟାସ କଲେ ଆହୁରି ଭଲ ହେବ।";
    } else {
        resultMsg.innerText = "ଚାପ ନ ରଖି ଅଧ୍ୟାୟଟିକୁ ଆଉଥେର ପଢ଼ି ପୁନର୍ବାର ଚେଷ୍ଟା କରନ୍ତୁ।";
    }
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;
    quizScreen.style.display = "block";
    resultScreen.style.display = "none";
    loadQuestion();
}

// Initial Load
loadQuestion();
</script>
