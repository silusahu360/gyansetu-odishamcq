<!DOCTYPE html>
<html lang="or">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ଦଶମ ଶ୍ରେଣୀ ଭୂଗୋଳ - ପ୍ରଥମ ଅଧ୍ୟାୟ: ସମ୍ବଳ ଓ ତା'ର ବିକାଶ (ମେଗା MCQ କୁଇଜ୍)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --success-color: #27ae60;
            --error-color: #e74c3c;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 750px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .quiz-meta {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--secondary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--primary-color);
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
        }

        .option-item {
            background-color: #f1f2f6;
            border: 2px solid transparent;
            padding: 12px 18px;
            margin-bottom: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        .option-item:hover:not(.disabled) {
            background-color: #e4e7eb;
            border-color: var(--secondary-color);
        }

        .option-item.correct {
            background-color: #d4edda;
            border-color: var(--success-color);
            color: #155724;
            font-weight: 600;
        }

        .option-item.incorrect {
            background-color: #f8d7da;
            border-color: var(--error-color);
            color: #721c24;
            font-weight: 600;
        }

        .option-item.disabled {
            cursor: default;
        }

        .explanation-box {
            background-color: #e8f4fd;
            border-left: 5px solid var(--secondary-color);
            padding: 15px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .explanation-box.show {
            display: block;
        }

        .explanation-title {
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 5px;
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            display: none;
        }

        .next-btn:hover {
            background-color: #2980b9;
        }

        .score-card {
            text-align: center;
            display: none;
        }

        .score-card h2 {
            color: var(--primary-color);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .score-card p {
            font-size: 1.1rem;
            color: #555;
            margin-bottom: 20px;
        }

        .restart-btn {
            background-color: var(--success-color);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .restart-btn:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

    <div class="quiz-container">

            <div class="subtitle">ସମ୍ବଳ ଓ ତା'ର ବିକାଶ - ମେଗା MCQ କୁଇଜ୍ (୫୫ଟି ପ୍ରଶ୍ନ)</div>

            <ul class="options-list" id="options-list">

            </div>

            <div class="btn-container">
                <button class="next-btn" id="next-btn" onclick="nextQuestion()">ପରବର୍ତ୍ତୀ ପ୍ରଶ୍ନ</button>

            <p id="score-text">ଆପଣଙ୍କ ସ୍କୋର୍: ୦ / ୫୫</p>
            <button class="restart-btn" onclick="restartQuiz()">ପୁନର୍ବାର ଖେଳନ୍ତୁ</button>
        </div>
    </div>

                explanation: "ଭାରତ ସ୍ୱାଧୀନତା ପାଇଲାପରେ ପ୍ରଥମ ପଞ୍ଚବାର୍ଷିକ ଯୋଜନାଠାରୁ ସମ୍ବଳ ଯୋଜନାର ଲକ୍ଷ୍ୟ ହାସଲ କରିବାପାଇଁ ଚେଷ୍ଟା କରିଆସିଛି[span_55](start_span)[span_55](end_span)."
            },
            {
                question: "ସମ୍ବଳର ଅସମାନ ବଣ୍ଟନ ଯୋଗୁଁ ସମାଜ କେତେଟି ସ୍ପଷ୍ଟ ଶ୍ରେଣୀରେ ବିଭକ୍ତ ହୋଇଛି?",
                options: ["ଦୁଇଟି (ଧନୀ ଓ ଦରିଦ୍ର)", "ତିନୋଟି", "ଚାରିଟି", "କୌଣସି ବିଭାଗ ନାହିଁ"],
                correct: 0,
                explanation: "ସମ୍ବଳ ଆହରଣରେ ବିଷମତା ଯୋଗୁଁ କେତେକ ମୁଷ୍ଟିମେୟ ବ୍ୟକ୍ତିଙ୍କ ପାଖରେ ଏହା ଜମା ହୋଇ ରହିଛି, ଫଳରେ ଧନୀ ଦରିଦ୍ର ଭେଦଭାବ ସୃଷ୍ଟି ହୋଇ ସମାଜ ଦୁଇଟି ସ୍ପଷ୍ଟ ଶ୍ରେଣୀରେ ବିଭକ୍ତ ହୋଇଛି[span_56](start_span)[span_56](end_span)."
            },
            {
                question: "ନିର୍ବିକାର ସମ୍ବଳ ଉତ୍ତୋଳନ ଯୋଗୁଁ କ'ଣ ନଷ୍ଟ ହେବାରେ ଲାଗିଛି?",
                options: ["ପାରିସ୍ଥିତିକ ଭାରସାମ୍ୟ", "ସୂର୍ଯ୍ୟଙ୍କ ଆଲୋକ", "ଚନ୍ଦ୍ରର ଗତି", "ରୁତୁ ପରିବର୍ତ୍ତନ"],
                correct: 0,
                explanation: "ନିର୍ବିକାର ସମ୍ବଳ ଉତ୍ତୋଳନ ଯୋଗୁଁ ପାରିସ୍ଥିତିକ ଭାରସାମ୍ୟ ନଷ୍ଟ ହେବାରେ ଲାଗିଛି ଏବଂ ଭୂତପ୍ରୀକରଣ, ଓଜୋନସ୍ତର ହ୍ରାସ, ପ୍ରଦୂଷଣ ବୃଦ୍ଧି ପାଉଛି[span_57](start_span)[span_57](end_span)."
            }
        ];

        let currentQuestion = 0;
        let score = 0;
        let answered = false;

        const questionText = document.getElementById("question-text");
        const optionsList = document.getElementById("options-list");
        const explanationBox = document.getElementById("explanation-box");
        const explanationText = document.getElementById("explanation-text");
        const nextBtn = document.getElementById("next-btn");
        const progressFill = document.getElementById("progress-fill");
        const quizScreen = document.getElementById("quiz-screen");
        const scoreCard = document.getElementById("score-card");
        const scoreText = document.getElementById("score-text");
        const questionCounter = document.getElementById("question-counter");
        const scoreDisplay = document.getElementById("score-display");

        function loadQuestion() {
            answered = false;
            explanationBox.classList.remove("show");
            nextBtn.style.display = "none";
            
            const currentData = quizData[currentQuestion];
            questionText.innerText = `ପ୍ରଶ୍ନ ${currentQuestion + 1}: ${currentData.question}`;
            questionCounter.innerText = `ପ୍ରଶ୍ନ ${currentQuestion + 1} / ${quizData.length}`;
            scoreDisplay.innerText = `ସ୍କୋର୍: ${score}`;
            
            // Update Progress Bar
            const progress = ((currentQuestion) / quizData.length) * 100;
            progressFill.style.width = `${progress}%`;

            // Shuffle options for interactivity
            let options = [...currentData.options];
            let correctOptionText = currentData.options[currentData.correct];
            
            // Randomize order
            options.sort(() => Math.random() - 0.5);
            
            optionsList.innerHTML = "";
            options.forEach((option) => {
                const li = document.createElement("li");
                li.className = "option-item";
                li.innerText = option;
                li.onclick = () => selectOption(option, correctOptionText, li);
                optionsList.appendChild(li);
            });
        }

        function selectOption(selectedOption, correctOption, element) {
            if (answered) return;
            answered = true;

            const optionItems = document.querySelectorAll(".option-item");

            // Disable all options
            optionItems.forEach(item => {
                item.classList.add("disabled");
                if (item.innerText === correctOption) {
                    item.classList.add("correct");
                }
            });

            if (selectedOption === correctOption) {
                score++;
                scoreDisplay.innerText = `ସ୍କୋର୍: ${score}`;
            } else {
                element.classList.add("incorrect");
            }

            // Show explanation
            const currentData = quizData[currentQuestion];
            explanationText.innerHTML = `<strong>ଠିକ୍ ଉତ୍ତର:</strong> ${correctOption}<br><br>${currentData.explanation}`;
            explanationBox.classList.add("show");
            
            // Show next button or finish
            nextBtn.style.display = "block";
            if (currentQuestion === quizData.length - 1) {
                nextBtn.innerText = "ଫଳାଫଳ ଦେଖନ୍ତୁ";
            }
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showScore();
            }
        }

        function showScore() {
            quizScreen.style.display = "none";
            scoreCard.style.display = "block";
            scoreText.innerText = `ଆପଣ ${quizData.length}ଟି ପ୍ରଶ୍ନରୁ ${score}ଟି ଠିକ୍ ଉତ୍ତର ଦେଇଛନ୍ତି!`;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            quizScreen.style.display = "block";
            scoreCard.style.display = "none";
            nextBtn.innerText = "ପରବର୍ତ୍ତୀ ପ୍ରଶ୍ନ";
            loadQuestion();
        }

        // Initialize Quiz
        loadQuestion();
    </script>
