{q:"କବିତାର ମୂଳ ଆକର୍ଷଣ କ’ଣ?",o:["ଚିଲିକାର ସନ୍ଧ୍ୟାକାଳୀନ ପ୍ରାକୃତିକ ସୌନ୍ଦର୍ଯ୍ୟ","ଯୁଦ୍ଧର ବର୍ଣ୍ଣନା","ନଗର ଜୀବନ","କୃଷିକାର୍ଯ୍ୟ"],a:0,e:"କବିତାର କେନ୍ଦ୍ରବିନ୍ଦୁ ହେଉଛି ଚିଲିକାର ସନ୍ଧ୍ୟାକାଳୀନ ସୌନ୍ଦର୍ଯ୍ୟ।"},
{q:"‘ଗୋଧୂଳି’ କେଉଁ ସମୟକୁ କୁହାଯାଏ?",o:["ସୂର୍ଯ୍ୟୋଦୟ ପୂର୍ବରୁ","ସୂର୍ଯ୍ୟାସ୍ତ ସମୟର ଧୂଳିମୟ ସନ୍ଧ୍ୟା","ମଧ୍ୟରାତ୍ରି","ମଧ୍ୟାହ୍ନ"],a:1,e:"ଗୋଧୂଳି ହେଉଛି ସୂର୍ଯ୍ୟାସ୍ତ ସମୟର ସନ୍ଧ୍ୟାବେଳ।"},
{q:"ଏହି କବିତା ପଢ଼ିବାରୁ କେଉଁ ଗୁଣ ବିକଶିତ ହୁଏ?",o:["ପ୍ରକୃତିକୁ ଉପଭୋଗ ଓ ସୁରକ୍ଷା କରିବାର ଭାବ","ଅପଚୟ","ଅବହେଳା","ହିଂସା"],a:0,e:"ପ୍ରକୃତିର ସୌନ୍ଦର୍ଯ୍ୟକୁ ଭଲପାଇବା ଓ ସୁରକ୍ଷା କରିବାର ପ୍ରେରଣା ମିଳେ।"},
{q:"ଚିଲିକାର ସୌନ୍ଦର୍ଯ୍ୟକୁ ଉପଭୋଗ କରିବା ସହ କେଉଁ ଦାୟିତ୍ୱ ଆମର?",o:["ଜଳ ଓ ପରିବେଶକୁ ସ୍ୱଚ୍ଛ ରଖିବା","ପ୍ଲାଷ୍ଟିକ୍ ଫିଙ୍ଗିବା","ପକ୍ଷୀଙ୍କୁ ହଇରାଣ କରିବା","ଜଳ ପ୍ରଦୂଷଣ କରିବା"],a:0,e:"ଚିଲିକାର ପରିବେଶ ଓ ଜଳଜୀବଙ୍କ ସୁରକ୍ଷା ଆମର ଦାୟିତ୍ୱ।"}
];
let index=0, answers=Array(questions.length).fill(null), locked=false;
const od=n=>String(n).replace(/\d/g,d=>"୦୧୨୩୪୫୬୭୮୯"[d]);
function render(){
 const q=questions[index]; document.getElementById('counter').textContent=`ପ୍ରଶ୍ନ ${od(index+1)} / ${od(questions.length)}`;
 document.getElementById('scoreLive').textContent=`ଠିକ୍: ${od(answers.filter((v,i)=>v===questions[i].a).length)}`;
 document.getElementById('bar').style.width=`${index/questions.length*100}%`;
 document.getElementById('question').textContent=`${od(index+1)}. ${q.q}`;
 const box=document.getElementById('options');box.innerHTML='';
 q.o.forEach((v,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=`${"କଖଗଘ"[i]||["କ","ଖ","ଗ","ଘ"][i]}. ${v}`;b.disabled=answers[index]!==null;
 if(answers[index]!==null){if(i===q.a)b.classList.add('correct');else if(i===answers[index])b.classList.add('wrong')}
 b.onclick=()=>choose(i);box.appendChild(b)});
 const f=document.getElementById('feedback');f.className='feedback';f.textContent='';
 if(answers[index]!==null){f.classList.add(answers[index]===q.a?'good':'bad');f.textContent=(answers[index]===q.a?'ଠିକ୍ ଉତ୍ତର! ':'ଭୁଲ ଉତ୍ତର। ')+q.e}
 document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=answers[index]===null;
 document.getElementById('next').textContent=index===questions.length-1?'ଫଳାଫଳ ଦେଖନ୍ତୁ':'ପରବର୍ତ୍ତୀ ପ୍ରଶ୍ନ →';
}
function choose(i){if(answers[index]!==null)return;answers[index]=i;render()}
function next(){if(index<questions.length-1){index++;render()}else showResult()}
function previous(){if(index>0){index--;render()}}
function showResult(){
 document.getElementById('quiz').hidden=true;document.getElementById('result').hidden=false;
 let score=answers.filter((v,i)=>v===questions[i].a).length;
 document.getElementById('finalScore').textContent=`${od(score)} / ${od(questions.length)}`;
 document.getElementById('remark').textContent=score>=25?'ଅତି ଉତ୍ତମ! ଆପଣଙ୍କ ପ୍ରସ୍ତୁତି ଭଲ ଅଛି।':score>=18?'ଭଲ ପ୍ରୟାସ। ଭୁଲ ଉତ୍ତରଗୁଡ଼ିକ ପୁଣି ପଢ଼ନ୍ତୁ।':'ଆଉଥରେ ଅଭ୍ୟାସ କରନ୍ତୁ। ଉତ୍ତର ସହ ବ୍ୟାଖ୍ୟା ପଢ଼ନ୍ତୁ।';
 document.getElementById('review').innerHTML='<h3>ଉତ୍ତର ସମୀକ୍ଷା</h3>'+questions.map((q,i)=>`<details><summary>${od(i+1)}. ${q.q} ${answers[i]===q.a?'✓':'✗'}</summary><p>ସଠିକ୍ ଉତ୍ତର: <b>${q.o[q.a]}</b></p><p>${q.e}</p></details>`).join('');
}
function restart(){index=0;answers=Array(questions.length).fill(null);document.getElementById('quiz').hidden=false;document.getElementById('result').hidden=true;render()}
render();
</script>
</body></html>
