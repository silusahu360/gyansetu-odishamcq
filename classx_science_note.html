<style>
  body {

<body>
  <h2>ଦଶମ ଶ୍ରେଣୀ · ଭୌତିକ ବିଜ୍ଞାନ</h2>
  <div class="card">
    <h3>ଅଧ୍ୟାୟ ୧: ରାସାୟନିକ ପ୍ରତିକ୍ରିୟା ଓ ସମୀକରଣ</h3>
    <p>ରାସାୟନିକ ପ୍ରତିକ୍ରିୟାରେ ଭାଗ ନେଉଥିବା ପଦାର୍ଥଗୁଡ଼ିକୁ <b>ପ୍ରତିକାରକ (Reactants)</b> ଏବଂ ଉତ୍ପନ୍ନ ହେଉଥିବା ନୂତନ ପଦାର୍ଥଗୁଡ଼ିକୁ <b>ଉତ୍ପାଦ (Products)</b> କୁହାଯାଏ।</p>
  </div>
