let index=0, answers={}, locked=false;
const $=id=>document.getElementById(id);
function render(){
 const item=data.questions[index]; locked=answers[index]!==undefined;
 $('count').textContent=`ପ୍ରଶ୍ନ ${index+1} / ${data.questions.length}`;
 $('score').textContent=`ସ୍କୋର: ${Object.keys(answers).filter(k=>answers[k]===data.questions[k].answer).length}`;
 $('bar').style.width=((index+1)/data.questions.length*100)+'%';
 $('qno').textContent=`ପ୍ରଶ୍ନ ${index+1}`;
 $('question').textContent=item.question;
 $('options').innerHTML='';
 item.options.forEach((op,i)=>{
  const b=document.createElement('button'); b.className='option'; b.textContent=`${'ଅଆଇଈ'[i]||String.fromCharCode(65+i)}. ${op}`;
  if(locked){if(i===item.answer)b.classList.add('correct');else if(i===answers[index])b.classList.add('wrong');}
  b.onclick=()=>choose(i); $('options').appendChild(b);
 });
 $('feedback').textContent=locked?(answers[index]===item.answer?'✓ ସଠିକ୍ ଉତ୍ତର!':`✗ ଭୁଲ୍। ସଠିକ୍ ଉତ୍ତର: ${item.options[item.answer]}`):'';
 $('prev').disabled=index===0; $('next').textContent=index===data.questions.length-1?'ଫଳାଫଳ ଦେଖନ୍ତୁ':'ପରବର୍ତ୍ତୀ ➜';
}
function choose(i){if(answers[index]!==undefined)return;answers[index]=i;render();}
function nextQ(){if(index<data.questions.length-1){index++;render()}else showResult();}
function prevQ(){if(index>0){index--;render()}}
function showResult(){$('quiz').classList.add('hide');$('result').classList.remove('hide');let s=data.questions.filter((q,i)=>answers[i]===q.answer).length;$('finalscore').textContent=`ଆପଣ ${data.questions.length} ରୁ ${s} ଟି ଠିକ୍ ଉତ୍ତର ଦେଇଛନ୍ତି।`;}
function restart(){index=0;answers={};$('result').classList.add('hide');$('quiz').classList.remove('hide');render()}
render();
</script></body></html>
