<!DOCTYPE html>
<html lang="or">
<head>
<meta charset="UTF-8">

<title>Class 9 Odia | Chapter 1 Quiz</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#17233b;--muted:#65738b;--accent:#2457c5;--green:#16834a;--red:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Oriya","Noto Sans Odia",system-ui,sans-serif;line-height:1.65}
header{background:linear-gradient(135deg,#183b83,#3979d8);color:#fff;padding:24px 16px 28px;text-align:center}
header h1{font-size:24px;margin:0 0 5px} header p{margin:0;opacity:.9;font-size:14px}
.wrap{max-width:760px;margin:18px auto;padding:0 12px 30px}
.info{background:#e8efff;border:1px solid #cbd9ff;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.progressbox{background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:14px;box-shadow:0 2px 10px #15264a0d}
.progressrow{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px}
.track{height:8px;background:#e8edf5;border-radius:10px;overflow:hidden}.bar{height:100%;width:0;background:var(--accent);transition:.2s}
.question{background:var(--card);padding:16px;border-radius:14px;margin:12px 0;box-shadow:0 2px 10px #15264a0d;border:1px solid #e8edf5}
.qtitle{font-weight:700;margin-bottom:10px;font-size:16px}
.opt{display:flex;gap:9px;align-items:flex-start;padding:9px 10px;margin:6px 0;border:1px solid #dfe5ef;border-radius:10px;cursor:pointer;background:#fff}
.opt:has(input:checked){border-color:var(--accent);background:#f0f5ff}
.opt input{margin-top:6px;accent-color:var(--accent)}
.opt.correct{border-color:var(--green);background:#eaf8f0}
.opt.wrong{border-color:var(--red);background:#fff0ee}
.explain{display:none;margin-top:9px;padding:9px 11px;border-radius:9px;background:#f1f5fa;font-size:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button{border:0;border-radius:10px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:var(--accent);color:white}.secondary{background:#e1e8f4;color:#20304d}
#result{display:none;background:#fff;border-radius:14px;padding:18px;margin:16px 0;text-align:center;box-shadow:0 2px 10px #15264a0d}
#result strong{font-size:28px;color:var(--accent)}
.answerkey{background:#fff;border-radius:14px;padding:16px;margin-top:18px}
.answerkey summary{font-weight:700;cursor:pointer}
.keygrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.keygrid span{background:#f0f4fa;padding:7px;text-align:center;border-radius:8px;font-size:14px}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
</style>
</head>
<body>
<header>
<h1>ଅଧ୍ୟାୟ ୧: କାହା ମୁଖ ଅନାଇ ବଞ୍ଚିବି</h1>
<p>ଶ୍ରେଣୀ ୯ • ଓଡ଼ିଆ • ୬୦ଟି ବହୁବିକଳ୍ପୀ ପ୍ରଶ୍ନ</p>
</header>
<div class="wrap">
<div class="info"><b>ନିର୍ଦ୍ଦେଶ:</b> ପ୍ରତ୍ୟେକ ପ୍ରଶ୍ନର ଗୋଟିଏ ସଠିକ୍ ଉତ୍ତର ବାଛନ୍ତୁ। ଶେଷରେ “ଉତ୍ତର ଯାଞ୍ଚ କରନ୍ତୁ” ଦବାନ୍ତୁ।</div>
<div class="progressbox"><div class="progressrow"><span>ପ୍ରଗତି</span><span id="count">୦ / ୬୦ ଉତ୍ତର</span></div><div class="track"><div class="bar" id="bar"></div></div></div>
<div id="quiz"></div>
<div class="actions">
<button class="primary" onclick="checkAnswers()">ଉତ୍ତର ଯାଞ୍ଚ କରନ୍ତୁ</button>
<button class="secondary" onclick="resetQuiz()">ପୁଣିଥରେ ଆରମ୍ଭ</button>
</div>
<div id="result"></div>
<details class="answerkey">
<summary>ଶେଷରେ ଉତ୍ତର ସୂଚୀ ଦେଖନ୍ତୁ</summary>
<div class="keygrid" id="keygrid"></div>
</details>
<footer>ଅଧ୍ୟାୟ ଆଧାରିତ ଅଭ୍ୟାସ ପ୍ରଶ୍ନ</footer>
</div>
<script>
const questions = [
{q:"‘କାହା ମୁଖ ଅନାଇ ବଞ୍ଚିବି’ କବିତାର କବି କିଏ?",o:["ଉପେନ୍ଦ୍ର ଭଞ୍ଜ","ଭକ୍ତଚରଣ ଦାସ","ଗଙ୍ଗାଧର ମେହେର","ରାଧାନାଥ ରାୟ"],a:1,e:"ଏହି କବିତାର କବି ଭକ୍ତଚରଣ ଦାସ।"},
{q:"ଭକ୍ତଚରଣ ଦାସ କେଉଁ ଶତାବ୍ଦୀର କବି?",o:["୧୬ଶ","୧୭ଶ","୧୮ଶ","୧୯ଶ"],a:2,e:"ପାଠ୍ୟପୁସ୍ତକ ଅନୁସାରେ ସେ ୧୮ଶ ଶତାବ୍ଦୀର କବି।"},
{q:"ଭକ୍ତଚରଣ ଦାସ କେଉଁ ଜିଲ୍ଲାରେ ଜନ୍ମଗ୍ରହଣ କରିଥିଲେ?",o:["ପୁରୀ","ଖୋର୍ଦ୍ଧା","କଟକ","ଗଞ୍ଜାମ"],a:1,e:"ସେ ଖୋର୍ଦ୍ଧା ଜିଲ୍ଲାରେ ଜନ୍ମଗ୍ରହଣ କରିଥିଲେ।"},
{q:"ଭକ୍ତଚରଣ ଦାସଙ୍କ ପ୍ରଥମ ନାମ କ’ଣ ଥିଲା?",o:["ବୈରାଗୀ ଚରଣ ପଟ୍ଟନାୟକ","ଦୀନବନ୍ଧୁ ଦାସ","ଗୋପାଳ ଚନ୍ଦ୍ର","ମଧୁସୂଦନ"],a:0,e:"ତାଙ୍କର ପ୍ରଥମ ନାମ ବୈରାଗୀ ଚରଣ ପଟ୍ଟନାୟକ ଥିଲା।"},
{q:"କେଉଁ ଧର୍ମରେ ଦୀକ୍ଷା ନେବା ପରେ ସେ ଭକ୍ତଚରଣ ଦାସ ନାମରେ ପରିଚିତ ହେଲେ?",o:["ଶୈବ","ବୌଦ୍ଧ","ବୈଷ୍ଣବ","ଜୈନ"],a:2,e:"ବୈଷ୍ଣବ ଧର୍ମରେ ଦୀକ୍ଷା ନେବା ପରେ ସେ ଏହି ନାମରେ ପରିଚିତ ହେଲେ।"},
{q:"ଭକ୍ତଚରଣ ଦାସ କେଉଁ ଧରଣର କବି ଭାବେ ପରିଚିତ?",o:["ବୀରରସ କବି","ଭକ୍ତିଭାବାପନ୍ନ କବି","ପ୍ରକୃତି କବି","ହାସ୍ୟରସ କବି"],a:1,e:"ସେ ଜଣେ ଭକ୍ତିଭାବାପନ୍ନ କବି ଥିଲେ।"},
{q:"‘କାହା ମୁଖ ଅନାଇ ବଞ୍ଚିବି’ କେଉଁ କାବ୍ୟରୁ ଗୃହୀତ?",o:["ଲାବଣ୍ୟବତୀ","ମଥୁରାମଙ୍ଗଳ","ବୈଦେହୀଶ ବିଳାସ","ତପସ୍ୱିନୀ"],a:1,e:"ଏହି ପଦ୍ୟାଂଶ ‘ମଥୁରାମଙ୍ଗଳ’ରୁ ଗୃହୀତ।"},
{q:"ଏହି ପଦ୍ୟାଂଶ କେଉଁ ଛାନ୍ଦରୁ ଗୃହୀତ?",o:["ପ୍ରଥମ ଛାନ୍ଦ","ତୃତୀୟ ଛାନ୍ଦ","ଷଷ୍ଠ ଛାନ୍ଦ","ନବମ ଛାନ୍ଦ"],a:2,e:"ଏହା ‘ମଥୁରାମଙ୍ଗଳ’ର ଷଷ୍ଠ ଛାନ୍ଦରୁ ନିଆଯାଇଛି।"},
{q:"କବିତାରେ ଶ୍ରୀକୃଷ୍ଣ କେଉଁ ଉତ୍ସବ ଦେଖିବାକୁ ମଥୁରା ଯାଉଛନ୍ତି?",o:["ରଥଯାତ୍ରା","ଧନୁ ଉତ୍ସବ","ଦୋଳଯାତ୍ରା","ରାସଉତ୍ସବ"],a:1,e:"ଶ୍ରୀକୃଷ୍ଣ କଂସର ଧନୁ ଉତ୍ସବ ଦେଖିବାକୁ ମଥୁରା ଯାଉଛନ୍ତି।"},
{q:"କୃଷ୍ଣଙ୍କ ମଥୁରା ଯିବା କଥା ଶୁଣି କାହାର ମାତୃହୃଦୟ ଆକୁଳ ହୋଇଉଠିଛି?",o:["ଦେବକୀ","ରୋହିଣୀ","ଯଶୋଦା","କୁନ୍ତୀ"],a:2,e:"କୃଷ୍ଣଙ୍କ ମଥୁରା ଯିବା କଥା ଶୁଣି ଯଶୋଦାଙ୍କ ମାତୃହୃଦୟ ଆକୁଳ ହୋଇଛି।"},
{q:"କବିତାରେ ‘ଶ୍ୟାମଘନ’ କାହାକୁ ସମ୍ବୋଧନ କରାଯାଇଛି?",o:["ବଳରାମ","ଶ୍ରୀକୃଷ୍ଣ","ଅକ୍ରୂର","ନନ୍ଦ"],a:1,e:"‘ଶ୍ୟାମଘନ’ ଶବ୍ଦଟି ଶ୍ରୀକୃଷ୍ଣଙ୍କୁ ବୁଝାଏ।"},
{q:"‘ମଧୁବନ’ର ଅର୍ଥ କ’ଣ?",o:["ବୃନ୍ଦାବନ","ମଥୁରା","ଗୋକୁଳ","ଦ୍ୱାରକା"],a:1,e:"ପାଠ୍ୟର ଶବ୍ଦାର୍ଥ ଅନୁସାରେ ମଧୁବନ ଅର୍ଥ ମଥୁରା।"},
{q:"‘ଦଶଦିଗ’ କେତୋଟି ଦିଗକୁ ବୁଝାଏ?",o:["ଆଠ","ନଅ","ଦଶ","ବାର"],a:2,e:"ଦଶଦିଗ ହେଉଛି ଦଶଟି ଦିଗ।"},
{q:"‘ଜୀବନ’ ଶବ୍ଦର ଏହି କବିତାରେ ଦିଆଯାଇଥିବା ଅର୍ଥ କ’ଣ?",o:["ଅନ୍ନ","ଜଳ","ଧନ","ବାୟୁ"],a:1,e:"ଶବ୍ଦାର୍ଥରେ ‘ଜୀବନ’ର ଅର୍ଥ ଜଳ ଦିଆଯାଇଛି।"},
{q:"‘ଷଢ଼’ ଶବ୍ଦର ଅର୍ଥ କ’ଣ?",o:["ଫୁଲ","ମାଛ","ପକ୍ଷୀ","ଗଛ"],a:1,e:"ପାଠ୍ୟର ଶବ୍ଦାର୍ଥ ଅନୁସାରେ ‘ଷଢ଼’ର ଅର୍ଥ ମାଛ।"},
{q:"‘ଚତୁଃସମ’ରେ କେଉଁ ସୁଗନ୍ଧି ଦ୍ରବ୍ୟଗୁଡ଼ିକର ଉଲ୍ଲେଖ ଅଛି?",o:["ଚନ୍ଦନ, ଅଗୁରୁ, କୁଙ୍କୁମ ଓ କସ୍ତୁରୀ","ଗୋଲାପ, ଚମ୍ପା, ମଲ୍ଲୀ ଓ ଜୁଇ","କର୍ପୂର, ତୁଳସୀ, ନିମ୍ବ ଓ ହଳଦୀ","ଚନ୍ଦନ, ତେଲ, ଘିଅ ଓ ମହୁ"],a:0,e:"ଚନ୍ଦନ, ଅଗୁରୁ, କୁଙ୍କୁମ ଓ କସ୍ତୁରୀକୁ ଚତୁଃସମ କୁହାଯାଇଛି।"},
{q:"‘ଅଞ୍ଜନ’ର ଅର୍ଥ କ’ଣ?",o:["ଚନ୍ଦନ","କଜଳ","ସିନ୍ଦୂର","ହଳଦୀ"],a:1,e:"‘ଅଞ୍ଜନ’ର ଅର୍ଥ କଜଳ।"},
{q:"‘ପାବଚ’ ଶବ୍ଦର ଅର୍ଥ କ’ଣ?",o:["ପାହାଡ଼","ପାହାଚ","ପୋଖରୀ","ପଥ"],a:1,e:"ଶବ୍ଦାର୍ଥ ଅନୁସାରେ ‘ପାବଚ’ର ଅର୍ଥ ପାହାଚ।"},
{q:"ଯଶୋଦା କୃଷ୍ଣଙ୍କୁ କେଉଁଥିରେ ଗାଧୋଇ ମୁହଁ ପୋଛାଇ ଦେବେ ବୋଲି କହିଛନ୍ତି?",o:["ସୁଗନ୍ଧିତ ଜଳରେ","ଚତୁଃସମ ଲେପି","କ୍ଷୀରରେ","ଯମୁନା ଜଳରେ"],a:1,e:"କବିତାରେ ଚତୁଃସମ ଲେପି ଯତ୍ନ କରିବାର କଥା ରହିଛି।"},
{q:"ଯଶୋଦା କୃଷ୍ଣଙ୍କ ମଥାକୁ କିପରି ସଜାଇବେ?",o:["ଫୁଲରେ","ଚିତା ଦେଇ","ମୁକୁଟ ପିନ୍ଧାଇ","ମୟୂରପୁଚ୍ଛ ଲଗାଇ"],a:1,e:"ଯଶୋଦା କୃଷ୍ଣଙ୍କ ଲଲାଟରେ ଚିତା ଦେବା କଥା କହିଛନ୍ତି।"},
{q:"କୃଷ୍ଣଙ୍କ କାନରେ କ’ଣ ଶୋଭା ପାଏ?",o:["କୁଣ୍ଡଳ","ମୋତିହାର","ଫୁଲମାଳ","ବାଜୁବନ୍ଧ"],a:0,e:"କବିତାରେ କୃଷ୍ଣଙ୍କ କାନରେ କୁଣ୍ଡଳ ଶୋଭା ପାଉଥିବା କଥା ଅଛି।"},
{q:"କୃଷ୍ଣ ମଥୁରା ଯିବାବେଳେ ଯଶୋଦା କାହାକୁ ସମର୍ପିବେ ବୋଲି ଚିନ୍ତା କରୁଛନ୍ତି?",o:["ନନ୍ଦଙ୍କୁ","ବଳରାମଙ୍କୁ","କୃଷ୍ଣଙ୍କୁ","ଅକ୍ରୂରଙ୍କୁ"],a:2,e:"ଯଶୋଦା କହୁଛନ୍ତି, କୃଷ୍ଣଙ୍କୁ କାହା ହାତରେ ସମର୍ପିବେ?"},

const odiaDigits = n => String(n).replace(/\d/g,d=>"୦୧୨୩୪୫୬୭୮୯"[d]);
const quiz=document.getElementById('quiz');
questions.forEach((item,i)=>{
 const card=document.createElement('section'); card.className='question'; card.id='q'+i;
 card.innerHTML=`<div class="qtitle">${odiaDigits(i+1)}. ${item.q}</div>`+
 item.o.map((opt,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"><span>(${["କ","ଖ","ଗ","ଘ"][j]}) ${opt}</span></label>`).join('')+
 `<div class="explain" id="e${i}"></div>`;
 quiz.appendChild(card);
});
document.getElementById('keygrid').innerHTML=questions.map((q,i)=>`<span>${odiaDigits(i+1)}. ${["କ","ଖ","ଗ","ଘ"][q.a]}</span>`).join('');
function updateProgress(){
 let n=questions.filter((q,i)=>document.querySelector(`input[name=q${i}]:checked`)).length;
 document.getElementById('count').textContent=`${odiaDigits(n)} / ${odiaDigits(questions.length)} ଉତ୍ତର`;
 document.getElementById('bar').style.width=(n/questions.length*100)+'%';
}
document.querySelectorAll('input[type=radio]').forEach(x=>x.addEventListener('change',updateProgress));
function checkAnswers(){
 let score=0,unanswered=0;
 questions.forEach((q,i)=>{
  const selected=document.querySelector(`input[name=q${i}]:checked`);
  const labels=document.querySelectorAll(`#q${i} .opt`);
  labels.forEach((l,j)=>{l.classList.remove('correct','wrong');if(j===q.a)l.classList.add('correct');});
  if(!selected)unanswered++;
  else if(Number(selected.value)===q.a)score++;
  else labels[Number(selected.value)].classList.add('wrong');
  const ex=document.getElementById('e'+i);ex.style.display='block';
  ex.textContent=(selected&&Number(selected.value)===q.a?'ଠିକ୍ ଉତ୍ତର। ':'ସଠିକ୍ ଉତ୍ତର: '+["କ","ଖ","ଗ","ଘ"][q.a]+'. ')+q.e;
 });
 const r=document.getElementById('result');r.style.display='block';
 r.innerHTML=`ଆପଣଙ୍କ ଫଳାଫଳ<br><strong>${odiaDigits(score)} / ${odiaDigits(questions.length)}</strong><br>ସଠିକ୍: ${odiaDigits(score)} | ଭୁଲ୍: ${odiaDigits(60-score-unanswered)} | ଉତ୍ତର ଦିଆନାହିଁ: ${odiaDigits(unanswered)}`;
 r.scrollIntoView({behavior:'smooth',block:'center'});
}
function resetQuiz(){
 document.querySelectorAll('input[type=radio]').forEach(x=>x.checked=false);
 document.querySelectorAll('.opt').forEach(x=>x.classList.remove('correct','wrong'));
 document.querySelectorAll('.explain').forEach(x=>{x.style.display='none';x.textContent='';});
 document.getElementById('result').style.display='none';updateProgress();window.scrollTo({top:0,behavior:'smooth'});
}
</script>
